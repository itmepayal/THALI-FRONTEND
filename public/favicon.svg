<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Thali</title>
  <!-- background tile -->
  <rect width="64" height="64" rx="14" fill="#D4412F"/>
  <!-- thali plate -->
  <circle cx="32" cy="32" r="22" fill="#FFF6E5"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#F6B93B" stroke-width="3"/>
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="#E58E26" stroke-width="1.5" stroke-dasharray="2 3" stroke-linecap="round"/>
  <!-- katori (bowls) -->
  <circle cx="32" cy="23" r="5" fill="#2F6B4F"/>
  <circle cx="23.5" cy="37" r="5" fill="#F6B93B"/>
  <circle cx="40.5" cy="37" r="5" fill="#D4412F"/>
  <!-- highlights -->
  <circle cx="30.5" cy="21.5" r="1.4" fill="#fff" opacity=".55"/>
  <circle cx="22" cy="35.5" r="1.4" fill="#fff" opacity=".55"/>
  <circle cx="39" cy="35.5" r="1.4" fill="#fff" opacity=".55"/>
</svg>